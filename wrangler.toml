    name = "seowebsite"
    main = "worker.js"
    compatibility_date = "2025-11-20"
    type = "javascript"

    [build]
    command = "npm run build"

    [site]
    bucket = "./public"
    # KV Namespace id: Wrangler will automatically bind a KV Namespace named "ASSETS"
    # to this Worker when deploying a Workers Site.
    # The ID for this KV Namespace should be automatically managed by Cloudflare.
    # If you need to manually specify it, you can add:
    # id = "YOUR_ACTUAL_KV_NAMESPACE_ID"

    [vars]
    # AHREFS_API_KEY = "your_ahrefs_api_key"
    # SEMRUSH_API_KEY = "your_semrush_api_key"
    # MOZ_ACCESS_ID = "your_moz_access_id"
    # MOZ_SECRET_KEY = "your_moz_secret_key"
