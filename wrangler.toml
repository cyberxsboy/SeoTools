name = "seowebsite"
main = "worker.js"
compatibility_date = "2025-11-20"

# 移除[site]部分，显式定义KV绑定
# bucket = "./public" # 此行将被替换为assets_for_kv_binding

# KV 绑定，用于存储静态文件
[kv_namespaces]
binding = "ASSETS"
id = "YOUR_KV_NAMESPACE_ID" # *** 在这里填入您的实际 KV Namespace ID ***

# 如果需要环境变量，可以在此处配置
[vars]
# AHREFS_API_KEY = "your_ahrefs_api_key"
# SEMRUSH_API_KEY = "your_semrush_api_key"
# MOZ_ACCESS_ID = "your_moz_access_id"
# MOZ_SECRET_KEY = "your_moz_secret_key"
