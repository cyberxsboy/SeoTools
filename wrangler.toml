name = "seowebsite"
main = "worker.js"
compatibility_date = "2025-11-20"
type = "javascript" # 明确指定Worker类型为JavaScript

# 静态资产配置
[build]
command = "npm run build" # 可以定义一个构建命令，如果需要预处理静态文件

[site]
bucket = "./public" # 指向静态文件所在的目录

# Wrangler 会自动将`public`目录内容上传到名为`seowebsite-workers_sites_assets`的KV Namespace，并将其绑定到Worker的`env.ASSETS`。
# 您不需要在这里再次手动定义[[kv_namespaces]]。
# 如果您在仪表板中手动创建了KV Namespace，请确保其名称是Cloudflare Pages/Workers Sites的默认命名模式
# 或者确保您的worker代码和wrangler.toml的KV绑定与仪表板中的绑定名称匹配。

[vars]
# AHREFS_API_KEY = "your_ahrefs_api_key"
# SEMRUSH_API_KEY = "your_semrush_api_key"
# MOZ_ACCESS_ID = "your_moz_access_id"
# MOZ_SECRET_KEY = "your_moz_secret_key"