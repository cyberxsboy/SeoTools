name = "seowebsite"
main = "worker.js"
compatibility_date = "2025-11-20"

# KV 绑定，用于存储静态文件
# 移除冲突的[kv_namespaces]表定义

[[kv_namespaces]] # 使用双括号表示数组元素
binding = "ASSETS"
id = "a01b6f73dd624dafb838b2f033dc47f8" # *** 在这里填入您的实际 KV Namespace ID ***

# 如果需要环境变量，可以在此处配置
[vars]
# AHREFS_API_KEY = "your_ahrefs_api_key"
# SEMRUSH_API_KEY = "your_semrush_api_key"
# MOZ_ACCESS_ID = "your_moz_access_id"
# MOZ_SECRET_KEY = "your_moz_secret_key"
